name: Work6 native engineering checks

on:
  pull_request:
    paths:
      - 'projects/fab-flow/**'
      - '.github/workflows/work6-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  typecheck-and-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Work6 dependencies
        run: npm install --prefix projects/fab-flow --package-lock=false --no-audit --no-fund
      - name: Typecheck Work6
        run: npm run typecheck --prefix projects/fab-flow
      - name: Build Work6 GitHub Pages output
        run: GITHUB_PAGES=true PAGES_BASE_PATH=/build-canvas/fab-flow-preview npm run build --prefix projects/fab-flow
      - name: Install Chromium for Playwright
        run: npx --prefix projects/fab-flow playwright install chromium --with-deps
      - name: Native browser regression
        run: npm run test:browser --prefix projects/fab-flow
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: work6-engineering-browser-evidence
          path: projects/fab-flow/evidence/
          if-no-files-found: ignore
