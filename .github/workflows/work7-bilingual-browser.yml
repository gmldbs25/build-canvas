name: Work 7 bilingual browser QA

on:
  push:
    branches: [main, work7-final-ko-qa]
    paths:
      - 'projects/web-evolution/**'
      - 'tests/web-evolution-browser.mjs'
      - 'tests/web-evolution-quality-browser.mjs'
      - 'tests/web-evolution-live-qa.mjs'
      - '.github/workflows/work7-bilingual-browser.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bilingual-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: chmod +x scripts/*.sh projects/orca/scripts/*.sh projects/transformer-to-agent/scripts/*.sh
      - run: npm run build:pages
      - name: Run Work 7 localization unit tests
        run: node --test tests/web-evolution-i18n.test.mjs
      - name: Install browser runner
        run: |
          npm install --no-save --package-lock=false playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Test EN/KR interactions across nine viewports
        run: node tests/web-evolution-browser.mjs
      - name: Validate authored rich text and dynamic locale state
        run: node tests/web-evolution-quality-browser.mjs
      - name: Upload Work 7 bilingual quality screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: work7-quality-screenshots
          path: work7-quality-captures
          if-no-files-found: ignore
