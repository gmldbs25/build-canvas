name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            projects/orca/package-lock.json
            projects/transformer-to-agent/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Make scripts executable
        run: chmod +x scripts/*.sh projects/orca/scripts/*.sh projects/transformer-to-agent/scripts/*.sh

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Verify Work 7 reading interactions
        run: node --test tests/web-evolution-reading.test.mjs

      - name: Verify Work 7 exhibit workspace
        run: |
          node --check projects/web-evolution/main.js
          node --test tests/web-evolution-workspace.test.mjs

      - name: Verify Work 7 bilingual system
        run: |
          node --check projects/web-evolution/i18n.js
          node --check projects/web-evolution/modern.js
          node --check projects/web-evolution/classic-search.js
          node --check projects/web-evolution/pacebook.js
          node --check projects/web-evolution/photo.js
          node --check projects/web-evolution/poster.js
          node --check projects/web-evolution/agent-report.js
          node --check projects/web-evolution/monitor.js
          node --test tests/web-evolution-i18n.test.mjs

      - name: Verify hidden elsewhere archive
        run: node --test tests/elsewhere.test.mjs

      - name: Build portfolio
        run: npm run build:pages

      - name: Verify exported elsewhere poster
        run: cmp extras/elsewhere/assets/attack-on-titan.webp dist-pages/elsewhere/assets/attack-on-titan.webp

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist-pages

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
