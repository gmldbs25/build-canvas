name: Refresh Work6 real FAB FLOW screenshots

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/work6-refresh-media.yml'
      - 'projects/fab-flow/scripts/capture-live-media.mjs'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: work6-real-captures
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout Build Canvas
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Work6 Playwright
        run: npm install --prefix projects/fab-flow --package-lock=false --no-audit --no-fund

      - name: Install Chromium and system dependencies
        run: npx --prefix projects/fab-flow playwright install --with-deps chromium

      - name: Capture genuine FAB FLOW app at device pixel ratio 2
        env:
          FAB_FLOW_URL: https://fabflow-yoon.vercel.app/
        run: node projects/fab-flow/scripts/capture-live-media.mjs

      - name: Upload captured originals for audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: work6-live-2x-png-evidence
          path: |
            projects/fab-flow/public/media/*.png
            projects/fab-flow/public/media/manifest.json
          if-no-files-found: warn
          retention-days: 14

      - name: Commit only verified actual screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add projects/fab-flow/public/media/*.png projects/fab-flow/public/media/manifest.json
          if git diff --cached --quiet; then
            echo "No actual image changes produced"
            exit 1
          fi
          git commit -m "fix(work6): replace low-resolution FAB FLOW captures with real 2x browser screenshots"
          git push origin HEAD:main

      - name: Trigger GitHub Pages deployment for Actions-authored commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api -X POST repos/${{ github.repository }}/actions/workflows/deploy-pages.yml/dispatches -f ref=main
