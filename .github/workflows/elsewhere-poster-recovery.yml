name: Recover existing elsewhere poster
on:
  push:
    branches: [elsewhere-poster-recovery]
permissions:
  contents: write
jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download existing official key visual
        shell: bash
        run: |
          set -eu
          mkdir -p extras/elsewhere/assets
          python -m pip install Pillow -q
          python - <<'PY'
          import urllib.request
          import io
          from PIL import Image
          urls = [
              "https://a.storyblok.com/f/178900/4090x5784/a810650153/c8a8b63b80b85744d18e952ae0b21b7a1637197683_main.jpg/m/1200x0/filters:quality(88):format(webp)",
              "https://a.storyblok.com/f/178900/4090x5784/a810650153/c8a8b63b80b85744d18e952ae0b21b7a1637197683_main.jpg",
              "https://shingeki.tv/news/wp-content/uploads/2021/11/sgk_kv4_comp_211112_RGB_web.jpg",
              "https://shingeki.tv/news/wp-content/uploads/2021/11/sgk_kv4_comp_211112_RGB_web-283x400.jpg",
          ]
          for url in urls:
              try:
                  request = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
                  with urllib.request.urlopen(request, timeout=20) as response:
                      data = response.read(30_000_000)
                  img = Image.open(io.BytesIO(data))
                  img.load()
                  print("SOURCE", url, "DIMENSIONS", img.size, flush=True)
                  if not (0.65 < img.width / img.height < 0.78 and img.width >= 283):
                      raise ValueError("Unexpected image dimensions")
                  img = img.convert("RGB")
                  img.thumbnail((1200, 1800), Image.Resampling.LANCZOS)
                  img.save("extras/elsewhere/assets/attack-on-titan.webp", "WEBP", quality=90)
                  print("SAVED", img.size, flush=True)
                  break
              except Exception as exc:
                  print("FAILED", url, str(exc), flush=True)
          else:
              raise SystemExit("No valid source")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add extras/elsewhere/assets/attack-on-titan.webp
          git commit -m "Store recovered original Attack on Titan key visual"
          git push origin HEAD:elsewhere-poster-recovery
